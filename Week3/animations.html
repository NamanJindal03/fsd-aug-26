<style>
    .box{
        width: 150px;
        height: 150px;
        border: 1px solid red;
        margin-top: 200px;
        margin-left: 200px;

        animation-name: boxAnimation;
        animation-duration: 3s;
        animation-iteration-count: 5;
    }
    /* @keyframes boxAnimation {
        from { box-shadow: 10px 10px orange;}
        to {box-shadow: 10px 10px yellow;}
    } */
    @keyframes boxAnimation {
        0% { box-shadow: 10px 10px orange;}
        10% { box-shadow: 10px 10px purple;}
        50% { box-shadow: 10px 10px pink;}
        100% { transform: translateX(200px);}
    }
</style>

<div class="box"></div>
