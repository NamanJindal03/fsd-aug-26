<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img-container{
            height: 300px;
            width: 300px;
            position: relative;
        }
        .img{
            height: 100%;
            width: 100%;
        }
        .badge{
            position: absolute;
            top: 5px;
            left: 5px;
            color: orange;
            border: 1px solid black;
            padding: 5% 8px;
            background-color: grey;
            font-weight: 800;
            border-radius: 25px;
        }
        .heart{
            position: absolute;
            top: 5px;
            right: 5px;
            color: orange;
        }
    </style>
</head>
<body>
    <div class="img-container">
        <img class="img" src="https://a0.muscache.com/im/pictures/Mt/MtTemplate-6764224/original/b934926a-7149-4286-be56-9fb1e42106b9.jpeg?im_w=720" alt="">
        <span class="badge">Trending</span>
        <span class="heart">H</span>
    </div>
</body>
</html>
